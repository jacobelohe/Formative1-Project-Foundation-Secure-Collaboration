services:
  quiz-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - somaquiz-network
    volumes:
      - somaquiz-data:/app/data

networks:
  somaquiz-network:
    driver: bridge

volumes:
  somaquiz-data:
    driver: local
