---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dest_dir }}"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: "0755"

- name: Copy docker-compose configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dest_dir }}/docker-compose.yml"
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: "0644"

- name: Copy Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../Dockerfile"
    dest: "{{ app_dest_dir }}/Dockerfile"
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: "0644"

- name: Copy services directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../services"
    dest: "{{ app_dest_dir }}/"
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: "0755"

- name: Deploy application environment configuration
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dest_dir }}/.env"
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: "0600"

- name: Build and start containerized application with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ app_dest_dir }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  register: compose_output
  changed_when: "'Started' in compose_output.stdout or 'Creating' in compose_output.stdout or 'Building' in compose_output.stdout"

- name: Wait for application health check endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
    return_content: true
  register: health_check
  until: health_check.status == 200
  retries: 12
  delay: 5
