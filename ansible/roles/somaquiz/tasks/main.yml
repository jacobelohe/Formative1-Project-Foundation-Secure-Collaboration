---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy application environment configuration
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dest_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Check for a previous successful release
  ansible.builtin.stat:
    path: "{{ app_dest_dir }}/.release"
  register: somaquiz_release_file

- name: Read the previous successful release
  ansible.builtin.slurp:
    src: "{{ app_dest_dir }}/.release"
  register: somaquiz_release
  when: somaquiz_release_file.stat.exists

- name: Deploy and verify the quiz API
  when: not ansible_check_mode
  vars:
    somaquiz_previous_image: "{{ (somaquiz_release.content | b64decode | trim) if somaquiz_release_file.stat.exists else '' }}"
  block:
    - name: Deploy the release
      ansible.builtin.include_tasks: release.yml
      vars:
        release_image: "{{ app_image }}"

    - name: Verify that the API is ready and connected to the database
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/ready"
        status_code: 200
        return_content: true
      register: somaquiz_ready
      until: (somaquiz_ready.json | default({})).get('database') == 'connected'
      retries: 5
      delay: 3

    - name: Record the successful release
      ansible.builtin.copy:
        content: "{{ app_image }}\n"
        dest: "{{ app_dest_dir }}/.release"
        owner: root
        group: root
        mode: "0644"

    # A cleanup problem must not roll back a healthy release.
    - name: Remove images from releases older than a week
      ansible.builtin.command: docker image prune --all --force --filter until=168h
      register: somaquiz_prune
      changed_when: "'Total reclaimed space: 0B' not in somaquiz_prune.stdout"
      failed_when: false

  rescue:
    - name: Keep the original failure for the final message
      ansible.builtin.set_fact:
        somaquiz_failed_task: "{{ ansible_failed_task.name }}"

    - name: Read container logs for troubleshooting
      ansible.builtin.command:
        cmd: docker compose logs --tail=50 quiz-api
        chdir: "{{ app_dest_dir }}"
      register: somaquiz_logs
      changed_when: false
      failed_when: false

    - name: Roll back to the previous release
      ansible.builtin.include_tasks: release.yml
      vars:
        release_image: "{{ somaquiz_previous_image }}"
      when: somaquiz_previous_image not in ['', app_image]

    - name: Report the failed deployment
      ansible.builtin.fail:
        msg: >-
          Deployment stopped at '{{ somaquiz_failed_task }}'.
          {{ 'No earlier release to restore.' if somaquiz_previous_image in ['', app_image] else 'Rolled back to ' ~ somaquiz_previous_image ~ '.' }}
          {{ somaquiz_logs.stdout | default('') }} {{ somaquiz_logs.stderr | default('') }}
