---
# Start release_image and wait until its container health check (/ready) passes.
- name: Write the Compose file for the release
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dest_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Pull the image and restart the service
  community.docker.docker_compose_v2:
    project_src: "{{ app_dest_dir }}"
    files:
      - docker-compose.yml
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 120
