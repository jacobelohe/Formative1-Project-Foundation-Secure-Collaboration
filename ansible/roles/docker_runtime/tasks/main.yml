---
- name: Install required runtime dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present

- name: Create directory for Docker apt keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Remove the legacy Docker source managed by the previous playbook
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    regexp: '^deb .*signed-by=/etc/apt/keyrings/docker\.asc.* https://download\.docker\.com/linux/ubuntu .* stable$'
    state: absent

- name: Add Docker official apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_repository

- name: Install Docker and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"
  when: not ansible_check_mode

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: not ansible_check_mode
