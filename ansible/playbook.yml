---
- name: Configure server, install dependencies, and deploy containerized application
  hosts: webservers
  become: true
  vars:
    app_port: 8000
    ssh_port: 22
    app_dest_dir: /opt/somaquiz
    app_env: production
    app_database_url: sqlite:///./somaquiz.db

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Install security packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
        state: present

    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Allow application port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp

    - name: Enable UFW service
      community.general.ufw:
        state: enabled

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(\x23\s*)?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(\x23\s*)?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable SSH empty passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(\x23\s*)?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Install required runtime dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - python3-venv
        state: present

    - name: Create directory for Docker apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add deployment user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user | default('ubuntu') }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dest_dir }}"
        state: directory
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: "0755"

    - name: Copy docker-compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ app_dest_dir }}/docker-compose.yml"
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: "0644"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../Dockerfile"
        dest: "{{ app_dest_dir }}/Dockerfile"
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: "0644"

    - name: Copy services directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../services"
        dest: "{{ app_dest_dir }}/"
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: "0755"

    - name: Deploy application environment configuration
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dest_dir }}/.env"
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: "0600"

    - name: Build and start containerized application with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dest_dir }}"
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin"
      register: compose_output
      changed_when: "'Started' in compose_output.stdout or 'Creating' in compose_output.stdout or 'Building' in compose_output.stdout"

    - name: Wait for application health check endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
        return_content: true
      register: health_check
      until: health_check.status == 200
      retries: 12
      delay: 5

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
