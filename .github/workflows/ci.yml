name: CI

# Run on pushes to every branch except main, and on every pull request.
# Pull requests are validated here before they can be merged (see branch protection).
on:
  push:
    branches-ignore:
      - main
  pull_request:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

# Cancel an older run of the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the pipeline on any lint error.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # Fails the pipeline if any test fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # reuse downloaded packages between runs
          cache-dependency-path: services/quiz-api/requirements*.txt
      - run: pip install -r services/quiz-api/requirements-dev.txt
      - run: PYTHONPATH=services/quiz-api pytest

  # Check the Python packages for known security vulnerabilities.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r services/quiz-api/requirements-dev.txt

  # Scan Terraform configuration for high and critical misconfigurations.
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          version: v0.76.0

  # Build the app image, scan it, and check that it starts correctly.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env is git-ignored; create it from the committed example (no secrets in it).
      - name: Create .env from example
        run: cp .env.example .env
      - name: Build image
        run: docker compose build
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: somaquiz-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Smoke test the container
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is healthy"
              docker compose down
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs
          docker compose down
          exit 1
